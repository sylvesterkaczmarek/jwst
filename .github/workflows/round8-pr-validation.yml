name: round8-pr-validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'round8-validation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install JWST test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Build, test, and push contribution branch
        run: bash .github/scripts/round8_prepare.sh
